[package]
name = "tracel-storage"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
tracel-core.workspace = true

rusqlite = { version = "0.40", features = ["bundled", "backup"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
