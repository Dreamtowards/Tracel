[package]
name = "tracel-agent"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
tracel-core.workspace = true
tracel-storage.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Performance"] }
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Media_Control", "Foundation", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage"] }
